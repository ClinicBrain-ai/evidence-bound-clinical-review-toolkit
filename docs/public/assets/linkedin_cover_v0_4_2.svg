<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-Bound Clinical Review Toolkit</title>
  <desc id="desc">Abstract workflow cover image showing AI Draft to Evidence to Missing Context to Human Review to Audit Trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="55%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#172026"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15212a"/>
      <stop offset="100%" stop-color="#0f171e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#78d6ce"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1050" cy="88" r="160" fill="#22313a" opacity="0.38"/>
  <circle cx="116" cy="540" r="190" fill="#0e3a3d" opacity="0.24"/>

  <g opacity="0.22" stroke="#5f737b" stroke-width="1">
    <path d="M70 116 H1130"/>
    <path d="M70 218 H1130"/>
    <path d="M70 320 H1130"/>
    <path d="M70 422 H1130"/>
    <path d="M158 60 V562"/>
    <path d="M356 60 V562"/>
    <path d="M554 60 V562"/>
    <path d="M752 60 V562"/>
    <path d="M950 60 V562"/>
  </g>

  <text x="70" y="104" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">
    Evidence-Bound Clinical Review Toolkit
  </text>
  <text x="72" y="153" fill="#bfd1d6" font-family="Arial, Helvetica, sans-serif" font-size="28">
    Making AI-generated healthcare-adjacent output reviewable
  </text>

  <g transform="translate(70 250)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="166" height="104" rx="14" fill="url(#panel)" stroke="#78d6ce" stroke-opacity="0.55"/>
      <rect x="214" y="0" width="166" height="104" rx="14" fill="url(#panel)" stroke="#78d6ce" stroke-opacity="0.55"/>
      <rect x="428" y="0" width="190" height="104" rx="14" fill="url(#panel)" stroke="#f0b85b" stroke-opacity="0.58"/>
      <rect x="666" y="0" width="190" height="104" rx="14" fill="url(#panel)" stroke="#78d6ce" stroke-opacity="0.55"/>
      <rect x="904" y="0" width="166" height="104" rx="14" fill="url(#panel)" stroke="#78d6ce" stroke-opacity="0.55"/>
    </g>

    <g stroke="#78d6ce" stroke-width="3" marker-end="url(#arrow)" opacity="0.95">
      <path d="M176 52 H203"/>
      <path d="M390 52 H417"/>
      <path d="M628 52 H655"/>
      <path d="M866 52 H893"/>
    </g>

    <text x="83" y="46" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">AI Draft</text>
    <text x="83" y="76" text-anchor="middle" fill="#a9bbc1" font-family="Arial, Helvetica, sans-serif" font-size="18">generated text</text>

    <text x="297" y="46" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Evidence</text>
    <text x="297" y="76" text-anchor="middle" fill="#a9bbc1" font-family="Arial, Helvetica, sans-serif" font-size="18">source links</text>

    <text x="523" y="43" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Missing</text>
    <text x="523" y="71" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Context</text>

    <text x="761" y="43" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Human</text>
    <text x="761" y="71" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Review</text>

    <text x="987" y="46" text-anchor="middle" fill="#eff6f8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Audit Trail</text>
    <text x="987" y="76" text-anchor="middle" fill="#a9bbc1" font-family="Arial, Helvetica, sans-serif" font-size="18">workflow history</text>
  </g>

  <g transform="translate(70 500)">
    <rect x="0" y="0" width="386" height="48" rx="24" fill="#1f2b32" stroke="#78d6ce" stroke-opacity="0.5"/>
    <text x="24" y="31" fill="#78d6ce" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">
      Portfolio prototype · Not for clinical use
    </text>
  </g>
</svg>
